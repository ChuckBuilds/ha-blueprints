blueprint:
  name: Noonlight dispatch (countdown, cancel, Off/Local/Test/Live)
  description: >-
    Sends a Noonlight alarm (police, fire or medical) after a cancellable
    countdown.

    When a trigger entity goes off (an alarm panel goes "triggered", or a
    smoke / CO / panic sensor turns "on") you get a critical push with two
    buttons:
      * Cancel - I'm safe  - nothing is sent to Noonlight.
      * Dispatch now       - skips the rest of the countdown.
    Disarming the alarm panel also cancels. If nobody responds before the
    countdown ends, the alarm is sent.

    What "sent" means is controlled by a mode helper (input_select):
      * Off   - dry run. Countdown and pushes only. Noonlight is never called.
      * Local - simulated. Fires fake Noonlight events inside Home Assistant so
                the status tracker, cancel buttons and logbook can be tested.
      * Test  - Noonlight SANDBOX (needs a sandbox server token).
      * Live  - Noonlight PRODUCTION. Real dispatchers, real police/fire/EMS.
    Any other value (unavailable, renamed option, typo) sends nothing and
    tells you to call 911 yourself.

    Create one automation per service (Police, Fire, Medical). Pair it with
    the "Noonlight status tracker" blueprint, which handles the result
    (alarm created / failed / cancelled) and the after-dispatch cancel button.

    Requires the Noonlight Enhanced integration (KruseLuds/noonlight-hass).
  domain: automation
  author: ChuckBuilds
  homeassistant:
    min_version: 2024.10.0
  input:
    trigger_section:
      name: What starts the countdown
      input:
        trigger_entities:
          name: Trigger entities
          description: >-
            Alarm panels (fire on "triggered") and/or binary sensors (fire on
            "on"). Police: your alarm panel. Fire: smoke / CO sensors.
            Medical: a panic button or helper toggle.
          selector:
            entity:
              multiple: true
              filter:
                - domain: alarm_control_panel
                - domain: binary_sensor
                - domain: input_boolean
        alarm_panel:
          name: Alarm panel (disarm cancels)
          description: >-
            Optional. Disarming this panel during the countdown cancels the
            dispatch. Leave empty for fire/medical if you have no panel.
          default: []
          selector:
            entity:
              filter:
                - domain: alarm_control_panel
        last_trigger_helper:
          name: Last tripped sensor helper
          description: >-
            Optional input_text written by the "Alarm sensor trigger"
            blueprint. Lets the alarm cause say "Front door" instead of just
            the panel name.
          default: []
          selector:
            entity:
              filter:
                - domain: input_text
    noonlight_section:
      name: Noonlight
      input:
        service:
          name: Service
          default: police
          selector:
            select:
              options:
                - label: Police
                  value: police
                - label: Fire
                  value: fire
                - label: Medical
                  value: medical
        mode_helper:
          name: Mode helper
          description: >-
            input_select with options exactly Off, Local, Test, Live.
            See examples/noonlight_helpers.yaml.
          selector:
            entity:
              filter:
                - domain: input_select
        sandbox_token:
          name: Sandbox server token
          description: >-
            Your Noonlight SANDBOX server token. Only used in Test mode, never
            sent in Live mode. In YAML you can write !secret noonlight_sandbox_token.
          default: ""
          selector:
            text:
              type: password
        instructions:
          name: Dispatcher instructions
          description: >-
            Read by the Noonlight operator. Gate codes, pets, who is home,
            where the key is. Your alarm cause is put in front of this.
          default: ""
          selector:
            text:
              multiline: true
    notify_section:
      name: Notifications and timing
      input:
        notify_service:
          name: Notify action
          description: >-
            Who gets the countdown push. A mobile app or notify group, e.g.
            notify.mobile_app_your_phone or notify.family_phones.
          selector:
            text:
        countdown:
          name: Countdown
          description: >-
            Seconds to cancel before Noonlight is called. This is on top of
            your alarm panel's own entry delay.
          default: 60
          selector:
            number:
              min: 10
              max: 600
              step: 5
              unit_of_measurement: seconds
              mode: box
    custom_section:
      name: Your extra actions (optional)
      collapsed: true
      input:
        on_triggered_actions:
          name: When the countdown starts
          description: Sirens, lights, TTS warning, cameras...
          default: []
          selector:
            action: {}
        on_cancelled_actions:
          name: When cancelled before dispatch
          description: Turn the siren back off, etc.
          default: []
          selector:
            action: {}
        on_dispatched_actions:
          name: When the alarm is handed to Noonlight
          description: Unlock the door for responders, turn on all lights, etc.
          default: []
          selector:
            action: {}

# One alarm at a time per service. A second door opening during the countdown
# must not start a second countdown or a second dispatch.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input trigger_entities
    to: ["triggered", "on"]
    # Coming back from unavailable/unknown (reboot, Zigbee drop) is not an alarm.
    not_from: ["unavailable", "unknown"]

variables:
  service: !input service
  mode_helper: !input mode_helper
  sandbox_token: !input sandbox_token
  alarm_panel: !input alarm_panel
  last_trigger_helper: !input last_trigger_helper
  instructions: !input instructions
  notify_service: !input notify_service
  countdown: !input countdown
  service_name: "{{ service | title }}"
  nl_mode: "{{ states(mode_helper) }}"
  # Panel triggers say which sensor tripped it, when the sensor blueprint
  # recorded one. Otherwise use the trigger entity's own name.
  cause_source: >-
    {% set helper = last_trigger_helper if last_trigger_helper is string else '' %}
    {% if trigger.entity_id.startswith('alarm_control_panel.')
          and helper and states(helper) not in ['', 'unknown', 'unavailable'] %}
      {{ states(helper) }}
    {% else %}
      {{ trigger.to_state.name }}
    {% endif %}
  alarm_cause: "{{ service_name }} alarm: {{ cause_source | trim }}"
  push_tag: "{{ 'noonlight_' ~ service }}"

actions:
  # Unique per run so buttons from an old notification can't act on this one.
  # (context is only available inside actions, not in the top-level variables.)
  - variables:
      action_cancel: "{{ 'NOONLIGHT_PRECANCEL_' ~ context.id }}"
      action_dispatch: "{{ 'NOONLIGHT_DISPATCH_' ~ context.id }}"

  - action: logbook.log
    data:
      name: "Noonlight {{ service_name }}"
      message: "triggered by {{ cause_source | trim }}. Mode {{ nl_mode }}. Countdown {{ countdown }} s."

  - choose: []
    default: !input on_triggered_actions

  # ---- 1. Countdown push ------------------------------------------------
  - action: "{{ notify_service }}"
    data:
      title: "{{ service_name }} alarm - {{ nl_mode }} mode"
      message: >-
        {{ cause_source | trim }}.
        {% if nl_mode == 'Live' %}Calling Noonlight in {{ countdown }} s.
        {% elif nl_mode == 'Test' %}Calling Noonlight SANDBOX in {{ countdown }} s.
        {% elif nl_mode == 'Local' %}Simulating a dispatch in {{ countdown }} s.
        {% else %}Dry run ({{ nl_mode }}) - Noonlight will not be called.{% endif %}
      data:
        tag: "{{ push_tag }}"
        # iOS
        push:
          interruption-level: critical
          sound:
            name: default
            critical: 1
            volume: 1.0
        # Android
        ttl: 0
        priority: high
        channel: alarm_stream
        actions:
          - action: "{{ action_cancel }}"
            title: "Cancel - I'm safe"
          - action: "{{ action_dispatch }}"
            title: "Dispatch now"

  # ---- 2. Wait for cancel / disarm / dispatch-now / timeout ---------------
  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_cancel }}"
        id: cancel
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_dispatch }}"
        id: dispatch_now
      - trigger: state
        entity_id: !input alarm_panel
        to: disarmed
        id: disarmed
    timeout:
      seconds: "{{ countdown }}"
    continue_on_timeout: true

  - variables:
      # A real timeout leaves wait.remaining at 0. No trigger with time left
      # means the wait itself failed to start (it returns instantly).
      outcome: >-
        {% if wait.trigger is not none %}{{ wait.trigger.id }}
        {% elif (wait.remaining or 0) > 0 %}wait_failed
        {% else %}timeout{% endif %}

  # Never dispatch early because the wait broke: sit out the countdown anyway
  # so disarming the panel still cancels.
  - if: "{{ outcome == 'wait_failed' }}"
    then:
      - action: logbook.log
        data:
          name: "Noonlight {{ service_name }}"
          message: "cancel buttons could not be armed; waiting {{ countdown }} s, disarm the panel to cancel."
      - delay:
          seconds: "{{ countdown }}"

  - variables:
      # Panel disarmed while the push was being answered still counts as cancel.
      panel_disarmed: >-
        {{ alarm_panel is string and alarm_panel != '' and is_state(alarm_panel, 'disarmed') }}

  # ---- 3. Cancelled before dispatch -------------------------------------
  - if:
      - condition: template
        value_template: "{{ outcome in ['cancel', 'disarmed'] or panel_disarmed }}"
    then:
      - action: logbook.log
        data:
          name: "Noonlight {{ service_name }}"
          message: "cancelled before dispatch ({{ 'panel disarmed' if outcome != 'cancel' else 'Cancel button' }}). Noonlight was not called."
      - action: "{{ notify_service }}"
        data:
          title: "{{ service_name }} alarm cancelled"
          message: "Cancelled before dispatch. Noonlight was NOT called."
          data:
            tag: "{{ push_tag }}"
      - choose: []
        default: !input on_cancelled_actions
      - stop: Cancelled before dispatch

  # ---- 4. Dispatch according to mode ------------------------------------
  - action: logbook.log
    data:
      name: "Noonlight {{ service_name }}"
      message: "countdown ended ({{ outcome }}). Dispatching in {{ nl_mode }} mode."

  # Tells the status tracker to expect a result. If none arrives (integration
  # missing, Noonlight unreachable, this run crashed) it warns you to call 911.
  - if: "{{ nl_mode in ['Local', 'Test', 'Live'] }}"
    then:
      - event: noonlight_dispatch_requested
        event_data:
          mode: "{{ nl_mode }}"
          service: "{{ service }}"
          alarm_cause: "{{ alarm_cause }}"

  - choose:
      - conditions: "{{ nl_mode == 'Off' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              title: "{{ service_name }} alarm - DRY RUN"
              message: "Mode is Off. Noonlight would have been called now: {{ alarm_cause }}"
              data:
                tag: "{{ push_tag }}"
          - stop: Dry run

      - conditions: "{{ nl_mode == 'Local' }}"
        sequence:
          # Same events the integration fires, so the status tracker and its
          # cancel button are exercised end to end without any network call.
          - event: noonlight_alarm_attempted
            event_data:
              environment: local
              api_endpoint: local
              alarm_cause: "{{ alarm_cause }}"
              services: ["{{ service }}"]
          # Real Noonlight takes a moment too; lets the tracker start listening.
          - delay: 1
          - event: noonlight_alarm_created
            event_data:
              environment: local
              api_endpoint: local
              alarm_cause: "{{ alarm_cause }}"
              services: ["{{ service }}"]
              alarm_id: "{{ 'LOCAL-' ~ now().strftime('%Y%m%d%H%M%S') }}"
              status: ACTIVE

      - conditions: "{{ nl_mode == 'Test' }}"
        sequence:
          # The integration fails closed if the token is empty and fires
          # noonlight_alarm_failed, which the status tracker reports.
          - action: noonlight.create_alarm
            data:
              service: "{{ service }}"
              alarm_cause: "{{ alarm_cause }}"
              instructions: "{{ instructions }}"
              api_endpoint: https://api-sandbox.noonlight.com/dispatch/v1
              server_token_override: "{{ sandbox_token }}"

      - conditions: "{{ nl_mode == 'Live' }}"
        sequence:
          # Production endpoint is forced here so a sandbox URL left in the
          # integration config can't silently swallow a real alarm.
          # No server_token_override: the integration rejects one in production.
          - action: noonlight.create_alarm
            data:
              service: "{{ service }}"
              alarm_cause: "{{ alarm_cause }}"
              instructions: "{{ instructions }}"
              api_endpoint: https://api.noonlight.com/dispatch/v1

    default:
      - action: logbook.log
        data:
          name: "Noonlight {{ service_name }}"
          message: "NOT dispatched: mode helper is '{{ nl_mode }}', expected Off/Local/Test/Live."
      - action: "{{ notify_service }}"
        data:
          title: "{{ service_name }} alarm NOT SENT"
          message: "Mode helper is '{{ nl_mode }}', not Off/Local/Test/Live. Noonlight was not called. Call 911 yourself if this is real."
          data:
            tag: "{{ push_tag }}"
            push:
              interruption-level: critical
              sound:
                name: default
                critical: 1
                volume: 1.0
            ttl: 0
            priority: high
            channel: alarm_stream
      - stop: Invalid mode

  - choose: []
    default: !input on_dispatched_actions

blueprint:
  name: Noonlight dispatch (countdown, cancel, Off/Local/Test/Live)
  description: >-
    Sends a Noonlight alarm (police, fire or medical) after a cancellable
    countdown.

    When a trigger entity goes off (an alarm panel goes "triggered", or a
    smoke / CO / panic sensor turns "on") you get a critical push with two
    buttons:
      * Cancel - I'm safe  - nothing is sent to Noonlight.
      * Dispatch now       - skips the rest of the countdown.
    Disarming the alarm panel also cancels. If nobody responds before the
    countdown ends, the alarm is sent.

    What "sent" means is controlled by a mode helper (input_select):
      * Off   - dry run. Countdown and pushes only. Noonlight is never called.
      * Local - simulated. Fires fake Noonlight events inside Home Assistant so
                the status tracker, cancel buttons and logbook can be tested.
      * Test  - Noonlight SANDBOX (needs a sandbox server token).
      * Live  - Noonlight PRODUCTION. Real dispatchers, real police/fire/EMS.
    Any other value (unavailable, renamed option, typo) sends nothing and
    tells you to call 911 yourself.

    Create one automation per service (Police, Fire, Medical). Pair it with
    the "Noonlight status tracker" blueprint, which handles the result
    (alarm created / failed / cancelled) and the after-dispatch cancel button.

    Requires the Noonlight Enhanced integration (KruseLuds/noonlight-hass).
  domain: automation
  author: ChuckBuilds
  homeassistant:
    min_version: 2024.10.0
  input:
    trigger_section:
      name: What starts the countdown
      input:
        trigger_entities:
          name: Trigger entities
          description: >-
            Alarm panels (fire on "triggered") and/or binary sensors (fire on
            "on"). Police: your alarm panel. Fire: smoke / CO sensors.
            Medical: a panic button or helper toggle.
          selector:
            entity:
              multiple: true
              filter:
                - domain: alarm_control_panel
                - domain: binary_sensor
                - domain: input_boolean
        alarm_panel:
          name: Alarm panel (disarm cancels)
          description: >-
            Optional. Disarming this panel during the countdown cancels the
            dispatch. Leave empty for fire/medical if you have no panel.
          default: []
          selector:
            entity:
              filter:
                - domain: alarm_control_panel
        panel_code:
          name: Panel code (for the Disarm button)
          description: >-
            Adds a Disarm button to the countdown push that disarms the panel
            above and cancels the dispatch in one tap. On iPhone it asks for
            Face ID / your passcode before it runs. Leave empty for no Disarm
            button (unless the panel needs no code). Saved in the automation
            like any other input.
          default: ""
          selector:
            text:
              type: password
        show_disarm_button:
          name: Show Disarm button
          description: >-
            Turn off to never show the Disarm button, even when a panel code
            is set or the panel needs no code.
          default: true
          selector:
            boolean:
        disarm_requires_unlock:
          name: Require phone unlock to Disarm
          description: >-
            The phone must be unlocked (Face ID / passcode on iPhone,
            fingerprint / face / PIN on Android 12+) before Disarm runs.
            Turning this off lets Disarm work straight from the lock screen,
            so anyone holding your phone could disarm the house.
          default: true
          selector:
            boolean:
        last_trigger_helper:
          name: Last tripped sensor helper
          description: >-
            Optional input_text written by the "Alarm sensor trigger"
            blueprint. Lets the alarm cause say "Front door" instead of just
            the panel name.
          default: []
          selector:
            entity:
              filter:
                - domain: input_text
    noonlight_section:
      name: Noonlight
      input:
        service:
          name: Service
          default: police
          selector:
            select:
              options:
                - label: Police
                  value: police
                - label: Fire
                  value: fire
                - label: Medical
                  value: medical
        mode_helper:
          name: Mode helper
          description: >-
            input_select with options exactly Off, Local, Test, Live.
            See examples/noonlight_helpers.yaml.
          selector:
            entity:
              filter:
                - domain: input_select
        sandbox_token:
          name: Sandbox server token
          description: >-
            Your Noonlight SANDBOX server token. Only used in Test mode, never
            sent in Live mode. In YAML you can write !secret noonlight_sandbox_token.
          default: ""
          selector:
            text:
              type: password
        instructions:
          name: Dispatcher instructions
          description: >-
            Read by the Noonlight operator. Gate codes, pets, who is home,
            where the key is. Your alarm cause is put in front of this.
          default: ""
          selector:
            text:
              multiline: true
    notify_section:
      name: Notifications and timing
      input:
        notify_devices:
          name: Phones to notify
          description: >-
            Phones with the Home Assistant Companion app. Each gets the
            critical countdown push with the Cancel / Dispatch now buttons.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        notify_service:
          name: Other notify action (optional)
          description: >-
            Also send to a notify action that is not a phone above, e.g. a
            notify group like notify.family_phones. Leave empty if not needed.
          default: ""
          selector:
            text:
        countdown:
          name: Countdown
          description: >-
            Seconds to cancel before Noonlight is called. This is on top of
            your alarm panel's own entry delay.
          default: 60
          selector:
            number:
              min: 10
              max: 600
              step: 5
              unit_of_measurement: seconds
              mode: box
    push_section:
      name: Customize the countdown push (optional)
      collapsed: true
      input:
        camera:
          name: Camera
          description: >-
            Shows a snapshot in the push. Long-press it on iPhone for the live
            feed.
          default: []
          selector:
            entity:
              filter:
                - domain: camera
        tap_url:
          name: Open when tapped
          description: >-
            Dashboard path the push opens, e.g. /lovelace/security. Leave empty
            to open the app normally.
          default: ""
          selector:
            text:
        extra_message:
          name: Extra message line
          description: >-
            Added under the alarm text. Templates work, e.g.
            Front door lock: {{ states('lock.front_door') }}
          default: ""
          selector:
            text:
              multiline: true
    custom_section:
      name: Your extra actions (optional)
      collapsed: true
      input:
        on_triggered_actions:
          name: When the countdown starts
          description: >-
            Sirens, lights, TTS warning... Runs alongside the countdown, so a
            failing device can't stop the dispatch.
          default: []
          selector:
            action: {}
        on_cancelled_actions:
          name: When cancelled before dispatch
          description: Turn the siren back off, etc.
          default: []
          selector:
            action: {}
        on_dispatched_actions:
          name: When the alarm is handed to Noonlight
          description: Unlock the door for responders, turn on all lights, etc.
          default: []
          selector:
            action: {}

# One alarm at a time per service. A second door opening during the countdown
# must not start a second countdown or a second dispatch.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input trigger_entities
    to: ["triggered", "on"]
    # Coming back from unavailable/unknown (reboot, Zigbee drop) is not an alarm.
    not_from: ["unavailable", "unknown"]

  # Phone check (a few ms, separate from alarm runs). With mode: single an alarm
  # can't start during it, but it only runs at HA start, on an automation reload
  # (which restarts in-flight runs anyway) or when a device is removed.
  # Phone check: re-check the picked phones when HA starts, when
  # automations reload (e.g. this one is saved) and when a device is removed.
  - trigger: homeassistant
    event: start
    id: phone_check
  - trigger: event
    event_type: automation_reloaded
    id: phone_check
  - trigger: event
    event_type: device_registry_updated
    event_data:
      action: remove
    id: phone_check

variables:
  service: !input service
  mode_helper: !input mode_helper
  sandbox_token: !input sandbox_token
  alarm_panel: !input alarm_panel
  last_trigger_helper: !input last_trigger_helper
  instructions: !input instructions
  notify_devices: !input notify_devices
  notify_service: !input notify_service
  countdown: !input countdown
  camera: !input camera
  tap_url: !input tap_url
  panel_code: !input panel_code
  show_disarm_button: !input show_disarm_button
  disarm_requires_unlock: !input disarm_requires_unlock
  # Disarm button only when there is a panel to disarm and a way to do it.
  show_disarm: >-
    {{ show_disarm_button and alarm_panel is string and alarm_panel != ''
       and (panel_code != '' or state_attr(alarm_panel, 'code_format') is none) }}
  extra_message: !input extra_message
  service_name: "{{ service | title }}"
  nl_mode: "{{ states(mode_helper) }}"
  # What tripped the alarm, best source first:
  #  1. The panel itself, if it reports the sensor (Alarmo's open_sensors +
  #     arm_mode attributes). Read from the state at the moment of triggering.
  #  2. The "Last tripped sensor" helper written by the sensor-trigger
  #     blueprint (Manual panel setups).
  #  3. The trigger entity's own name.
  # Same wording as the sensor-trigger blueprint: "Front Door opened (armed
  # night)", "Motion detected: Hall Motion (armed away)".
  cause_source: >-
    {% set helper = last_trigger_helper if last_trigger_helper is string else '' %}
    {% if trigger.id == 'phone_check' %}
    {% else %}
      {% set panel_sensors = (trigger.to_state.attributes.get('open_sensors') or {})
                              if trigger.entity_id.startswith('alarm_control_panel.') else {} %}
      {% set found = (panel_sensors.keys() | list | select('search', '^binary_sensor\\.') | list)
                     if panel_sensors is mapping else [] %}
      {% set first = found[0] if found else none %}
      {% if first %}
        {% set kind = state_attr(first, 'device_class') or '' %}
        {% set name = (states[first].name if states[first] else first)[:60] %}
        {% set mode = (trigger.to_state.attributes.get('arm_mode') or '') | replace('_', ' ') %}
        {% if kind in ['door', 'window', 'garage_door', 'opening'] %}{{ name }} opened
        {%- elif kind in ['motion', 'occupancy', 'presence', 'moving'] %}Motion detected: {{ name }}
        {%- else %}{{ name }} triggered{% endif %}{{ (' (' ~ mode ~ ')') if mode else '' }}
      {% elif trigger.entity_id.startswith('alarm_control_panel.')
              and helper and states(helper) not in ['', 'unknown', 'unavailable'] %}
        {{ states(helper) }}
      {% else %}
        {{ trigger.to_state.name }}
      {% endif %}
    {% endif %}
  alarm_cause: "{{ service_name }} alarm: {{ cause_source | trim }}"
  push_tag: "{{ 'noonlight_' ~ service }}"
  # Each Companion app phone has a notify action named after the phone:
  # notify.mobile_app_<phone name>. Phones first, the optional extra action last.
  notify_targets: >-
    {% set ns = namespace(targets=[]) %}
    {% for device in notify_devices if device_attr(device, 'name') %}
      {% set ns.targets = ns.targets + ['notify.mobile_app_' ~ (device_attr(device, 'name') | slugify)] %}
    {% endfor %}
    {% if notify_service %}{% set ns.targets = ns.targets + [notify_service] %}{% endif %}
    {{ ns.targets | unique | list }}
  # iOS critical alert + Android alarm channel: rings through silent mode.
  critical_data:
    push:
      interruption-level: critical
      sound:
        name: default
        critical: 1
        volume: 1.0
    ttl: 0
    priority: high
    channel: alarm_stream
  # Optional camera snapshot (iOS live feed on long-press) and tap target.
  push_media: >-
    {% set media = {} %}
    {% if camera is string and camera %}
      {% set media = dict(media, image='/api/camera_proxy/' ~ camera, entity_id=camera) %}
    {% endif %}
    {% if tap_url %}{% set media = dict(media, url=tap_url, clickAction=tap_url) %}{% endif %}
    {{ media }}

actions:
  # ---- Phone check (its own triggers only; alarm runs skip this) -------
  # A phone that was removed or re-registered (new device) gets no pushes,
  # silently. Say so in a persistent notification until it is re-picked.
  - if: "{{ trigger.id == 'phone_check' }}"
    then:
      - variables:
          missing_phones: >-
            {% set ns = namespace(n=0) %}
            {% for d in notify_devices if not device_attr(d, 'name') %}{% set ns.n = ns.n + 1 %}{% endfor %}
            {{ ns.n }}
      - if: "{{ missing_phones | int > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: "{{ 'missing_phone_' ~ this.entity_id }}"
              title: Phone missing from an alarm automation
              message: >-
                {{ missing_phones }} phone(s) picked in "{{ this.attributes.friendly_name }}"
                no longer exist (removed, or the Companion app registered again as a
                new device), so they get no pushes. Open the automation and pick the
                phone again.
          - action: logbook.log
            data:
              name: "{{ this.attributes.friendly_name }}"
              message: "{{ missing_phones }} picked phone(s) no longer exist - re-pick them"
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ 'missing_phone_' ~ this.entity_id }}"
      - stop: Phone check only

  # Unique per run so buttons from an old notification can't act on this one.
  # (context is only available inside actions, not in the top-level variables.)
  - variables:
      action_cancel: "{{ 'NOONLIGHT_PRECANCEL_' ~ context.id }}"
      action_dispatch: "{{ 'NOONLIGHT_DISPATCH_' ~ context.id }}"
      action_disarm: "{{ 'NOONLIGHT_DISARM_' ~ context.id }}"

  - action: logbook.log
    data:
      name: "Noonlight {{ service_name }}"
      message: >-
        triggered by {{ cause_source | trim }}. Mode {{ nl_mode }}. Countdown {{ countdown }} s.
        {% if not notify_targets %}WARNING: no phones or notify action set, nobody gets a push.{% endif %}

  # Two branches run side by side. Pushes and your own actions are in the
  # first: a renamed phone, a typo'd notify action or an offline siren fails
  # only that branch. The countdown and dispatch are in the second and always
  # run.
  - parallel:
      # ---- 1. Countdown push + your actions --------------------------------
      - sequence:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ service_name }} alarm: {{ cause_source | trim }}"
                    message: >-
                      {% set stop = 'Disarm' if show_disarm else 'Cancel' %}
                      {% if nl_mode == 'Live' %}{{ stop }}, or Noonlight is called in {{ countdown }} s.
                      {% elif nl_mode == 'Test' %}{{ stop }}, or Noonlight SANDBOX is called in {{ countdown }} s.
                      {% elif nl_mode == 'Local' %}{{ stop }}, or a dispatch is simulated in {{ countdown }} s.
                      {% else %}Dry run ({{ nl_mode }} mode) - Noonlight will not be called.{% endif %}
                      {{ extra_message }}
                    # Disarm needs the phone unlocked first (authenticationRequired):
                    # Face ID / passcode on iPhone, fingerprint / face / PIN on
                    # Android 12+. Older Android ignores it.
                    # Cancel stops Noonlight but leaves the panel armed, for
                    # when you are away and the camera shows nothing wrong.
                    data: >-
                      {% set disarm = [{'action': action_disarm, 'title': 'Disarm',
                                        'authenticationRequired': disarm_requires_unlock}] if show_disarm else [] %}
                      {{ dict(dict(critical_data, tag=push_tag, actions=disarm + [
                           {'action': action_cancel, 'title': "Cancel - I'm safe"},
                           {'action': action_dispatch, 'title': 'Dispatch now'}]), **push_media) }}
          - choose: []
            default: !input on_triggered_actions

      # ---- 2. Countdown, then cancel or dispatch -----------------------------
      - sequence:
          # Wait for cancel / disarm / dispatch-now / timeout.
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_cancel }}"
                id: cancel
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_dispatch }}"
                id: dispatch_now
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_disarm }}"
                id: disarm_button
              - trigger: state
                entity_id: !input alarm_panel
                to: disarmed
                id: disarmed
            timeout:
              seconds: "{{ countdown }}"
            continue_on_timeout: true

          - variables:
              # A real timeout leaves wait.remaining at 0. No trigger with time
              # left means the wait itself failed to start (it returns instantly).
              outcome: >-
                {% if wait.trigger is not none %}{{ wait.trigger.id }}
                {% elif (wait.remaining or 0) > 0 %}wait_failed
                {% else %}timeout{% endif %}

          # Never dispatch early because the wait broke: sit out the countdown
          # anyway so disarming the panel still cancels.
          - if: "{{ outcome == 'wait_failed' }}"
            then:
              - action: logbook.log
                data:
                  name: "Noonlight {{ service_name }}"
                  message: "cancel buttons could not be armed; waiting {{ countdown }} s, disarm the panel to cancel."
              - delay:
                  seconds: "{{ countdown }}"

          - variables:
              # Panel disarmed while the push was being answered still counts as cancel.
              panel_disarmed: >-
                {{ alarm_panel is string and alarm_panel != '' and is_state(alarm_panel, 'disarmed') }}

          # ---- 3. Cancelled before dispatch --------------------------------
          - if:
              - condition: template
                value_template: "{{ outcome in ['cancel', 'disarmed', 'disarm_button'] or panel_disarmed }}"
            then:
              - action: logbook.log
                data:
                  name: "Noonlight {{ service_name }}"
                  message: >-
                    cancelled before dispatch
                    ({{ {'cancel': 'Cancel button', 'disarm_button': 'Disarm button'}.get(outcome, 'panel disarmed') }}).
                    Noonlight was not called.
              # Side by side so a bad notify target can't skip your actions
              # (siren off) and a failing action can't skip the push.
              - parallel:
                  - repeat:
                      for_each: "{{ notify_targets }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: >-
                              {{ service_name }} alarm
                              {{ 'cancelled' if outcome == 'cancel' else 'disarmed' }}
                            message: >-
                              {{ cause_source | trim }}. Noonlight was NOT called.
                              {{ 'The panel is still armed.' if outcome == 'cancel' else '' }}
                            data:
                              tag: "{{ push_tag }}"
                  - sequence:
                      - choose: []
                        default: !input on_cancelled_actions
                  # Disarm button: disarm the panel, then make sure it took.
                  # Noonlight is not being called either way.
                  - sequence:
                      - if: "{{ outcome == 'disarm_button' }}"
                        then:
                          - action: alarm_control_panel.alarm_disarm
                            target:
                              entity_id: "{{ alarm_panel }}"
                            data: "{{ {'code': panel_code} if panel_code else {} }}"
                            continue_on_error: true
                          - wait_template: "{{ is_state(alarm_panel, 'disarmed') }}"
                            timeout: "00:00:10"
                            continue_on_timeout: true
                          - if: "{{ not is_state(alarm_panel, 'disarmed') }}"
                            then:
                              - action: logbook.log
                                data:
                                  name: "Noonlight {{ service_name }}"
                                  message: >-
                                    Disarm button: panel did not disarm (check the panel code).
                                    Noonlight was not called.
                              - repeat:
                                  for_each: "{{ notify_targets }}"
                                  sequence:
                                    - action: "{{ repeat.item }}"
                                      continue_on_error: true
                                      data:
                                        title: Panel did NOT disarm
                                        message: >-
                                          Noonlight was not called, but
                                          {{ state_attr(alarm_panel, 'friendly_name') }} is still
                                          {{ states(alarm_panel) }}. Disarm it from the app or keypad,
                                          and check the panel code in the dispatch automation.
                                        data: "{{ dict(critical_data, tag=push_tag ~ '_disarm') }}"
              - stop: Cancelled before dispatch

          # ---- 4. Dispatch according to mode -------------------------------
          - action: logbook.log
            data:
              name: "Noonlight {{ service_name }}"
              message: "countdown ended ({{ outcome }}). Dispatching in {{ nl_mode }} mode."

          # Tells the status tracker to expect a result. If none arrives
          # (integration missing, Noonlight unreachable, this run crashed) it
          # warns you to call 911.
          - if: "{{ nl_mode in ['Local', 'Test', 'Live'] }}"
            then:
              - event: noonlight_dispatch_requested
                event_data:
                  mode: "{{ nl_mode }}"
                  service: "{{ service }}"
                  alarm_cause: "{{ alarm_cause }}"

          - choose:
              - conditions: "{{ nl_mode == 'Off' }}"
                sequence:
                  - repeat:
                      for_each: "{{ notify_targets }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "{{ service_name }} alarm - DRY RUN"
                            message: "Mode is Off. Noonlight would have been called now: {{ alarm_cause }}"
                            data:
                              tag: "{{ push_tag }}"
                  - stop: Dry run

              - conditions: "{{ nl_mode == 'Local' }}"
                sequence:
                  # Same events the integration fires, so the status tracker and
                  # its cancel button are exercised end to end without any
                  # network call.
                  - event: noonlight_alarm_attempted
                    event_data:
                      environment: local
                      api_endpoint: local
                      alarm_cause: "{{ alarm_cause }}"
                      services: ["{{ service }}"]
                  # Real Noonlight takes a moment too; lets the tracker start listening.
                  - delay: 1
                  - event: noonlight_alarm_created
                    event_data:
                      environment: local
                      api_endpoint: local
                      alarm_cause: "{{ alarm_cause }}"
                      services: ["{{ service }}"]
                      alarm_id: "{{ 'LOCAL-' ~ now().strftime('%Y%m%d%H%M%S') }}"
                      status: ACTIVE

              - conditions: "{{ nl_mode == 'Test' }}"
                sequence:
                  # The integration fails closed if the token is empty and fires
                  # noonlight_alarm_failed, which the status tracker reports.
                  - action: noonlight.create_alarm
                    data:
                      service: "{{ service }}"
                      alarm_cause: "{{ alarm_cause }}"
                      instructions: "{{ instructions }}"
                      api_endpoint: https://api-sandbox.noonlight.com/dispatch/v1
                      server_token_override: "{{ sandbox_token }}"

              - conditions: "{{ nl_mode == 'Live' }}"
                sequence:
                  # Production endpoint is forced here so a sandbox URL left in
                  # the integration config can't silently swallow a real alarm.
                  # No server_token_override: the integration rejects one in
                  # production.
                  - action: noonlight.create_alarm
                    data:
                      service: "{{ service }}"
                      alarm_cause: "{{ alarm_cause }}"
                      instructions: "{{ instructions }}"
                      api_endpoint: https://api.noonlight.com/dispatch/v1

            default:
              - action: logbook.log
                data:
                  name: "Noonlight {{ service_name }}"
                  message: "NOT dispatched: mode helper is '{{ nl_mode }}', expected Off/Local/Test/Live."
              - repeat:
                  for_each: "{{ notify_targets }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ service_name }} alarm NOT SENT"
                        message: "Mode helper is '{{ nl_mode }}', not Off/Local/Test/Live. Noonlight was not called. Call 911 yourself if this is real."
                        data: "{{ dict(critical_data, tag=push_tag) }}"
              - stop: Invalid mode

          - choose: []
            default: !input on_dispatched_actions

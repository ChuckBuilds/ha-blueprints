blueprint:
  name: Alarm sensor trigger (sensors trip the alarm panel)
  description: >-
    Trips an alarm panel when a door / window / motion sensor opens while the
    panel is armed.

    False-alarm guards:
      * Only an "off" -> "on" change counts. A sensor coming back from
        unavailable (reboot, Zigbee/Z-Wave drop, battery swap) is ignored.
      * The sensor must stay open for the debounce time.
      * Only the armed states you pick count (e.g. away + night, not home).
      * The panel's own entry delay (manual panel "delay_time") still applies,
        so you get time to disarm before it goes "triggered".

    Optionally records which sensor tripped, so the Noonlight dispatch can
    tell the operator "Back door" instead of just "Alarm panel".

    Arming check: when the panel arms into one of your armed states, any of
    these sensors that is open or offline is reported (push + persistent
    notification). An open or offline sensor cannot trip the alarm until it
    reports closed, so arming that way silently leaves a hole.
  domain: automation
  author: ChuckBuilds
  homeassistant:
    min_version: 2024.10.0
  input:
    alarm_panel:
      name: Alarm panel
      selector:
        entity:
          filter:
            - domain: alarm_control_panel
    sensors:
      name: Sensors
      description: Doors, windows, motion. Must report "on" when open / detected.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    armed_states:
      name: Armed states that count
      description: >-
        Sensors only trip the panel in these states. Tip: make separate
        automations for perimeter sensors (all modes) and interior motion
        (away only).
      default: [armed_away, armed_night]
      selector:
        select:
          multiple: true
          options:
            - label: Armed away
              value: armed_away
            - label: Armed home
              value: armed_home
            - label: Armed night
              value: armed_night
            - label: Armed vacation
              value: armed_vacation
            - label: Armed custom bypass
              value: armed_custom_bypass
    debounce:
      name: Debounce
      description: Seconds the sensor must stay open before it counts. 0 = instant.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: seconds
          mode: box
    last_trigger_helper:
      name: Last tripped sensor helper
      description: >-
        Optional input_text. Gets what happened, e.g. "Front Door opened" or
        "Motion detected: Kitchen Motion", read by the Noonlight dispatch
        blueprint for the push and the alarm cause.
      default: []
      selector:
        entity:
          filter:
            - domain: input_text

    arm_check_section:
      name: Arming check (optional pushes)
      collapsed: true
      input:
        check_notify_devices:
          name: Phones to tell
          description: >-
            Get a push when the panel arms while one of these sensors is open
            or offline. A persistent notification is shown either way.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        check_notify_service:
          name: Other notify action
          description: Optional, e.g. a notify group like notify.family_phones.
          default: ""
          selector:
            text:

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input sensors
    from: "off"
    to: "on"
    for:
      seconds: !input debounce
  # Arming check: the panel has finished arming into one of your states.
  - trigger: state
    entity_id: !input alarm_panel
    to: !input armed_states
    id: arm_check

conditions:
  - condition: state
    entity_id: !input alarm_panel
    state: !input armed_states

variables:
  alarm_panel: !input alarm_panel
  last_trigger_helper: !input last_trigger_helper
  # What happened, in words, for the push and the Noonlight operator:
  # "Front Door opened (armed night)", "Motion detected: Kitchen Motion
  # (armed away)". Motion puts the verb first because motion sensor names
  # often already say "Motion". The armed mode tells the operator whether
  # people should be home. Rendered when the automation starts, i.e. before
  # the panel is tripped, so the panel still shows the mode.
  # input_text holds 100 characters: the name is shortened to fit, never the
  # verb or the mode (longest: "Motion detected: " + 60 + " (armed custom bypass)").
  what_happened: >-
    {%- set kind = trigger.to_state.attributes.device_class | default('') -%}
    {%- set name = trigger.to_state.name[:60] -%}
    {%- set mode = states(alarm_panel) | replace('_', ' ') -%}
    {%- if kind in ['door', 'window', 'garage_door', 'opening'] -%}{{ name }} opened
    {%- elif kind in ['motion', 'occupancy', 'presence'] -%}Motion detected: {{ name }}
    {%- else -%}{{ name }} triggered{%- endif %} ({{ mode }})

actions:
  # ---- Arming check (own trigger; the trip path below is unchanged) --------
  - if: "{{ trigger.id == 'arm_check' }}"
    then:
      - variables:
          sensors: !input sensors
          check_notify_devices: !input check_notify_devices
          check_notify_service: !input check_notify_service
          problems: >-
            {% set ns = namespace(p=[]) %}
            {% for e in sensors %}
              {% set st = states(e) %}
              {% if st == 'on' %}{% set ns.p = ns.p + [state_attr(e, 'friendly_name') ~ ' is open'] %}
              {% elif st in ['unavailable', 'unknown'] %}{% set ns.p = ns.p + [state_attr(e, 'friendly_name') ~ ' is offline'] %}
              {% endif %}
            {% endfor %}
            {{ ns.p }}
          targets: >-
            {% set ns = namespace(t=[]) %}
            {% for d in check_notify_devices if device_attr(d, 'name') %}
              {% set ns.t = ns.t + ['notify.mobile_app_' ~ (device_attr(d, 'name') | slugify)] %}
            {% endfor %}
            {% if check_notify_service %}{% set ns.t = ns.t + [check_notify_service] %}{% endif %}
            {{ ns.t }}
          armed_as: "{{ trigger.to_state.state | replace('armed_', '') | replace('_', ' ') }}"
      - if: "{{ problems | count > 0 }}"
        then:
          - action: logbook.log
            data:
              name: Alarm
              message: "armed ({{ armed_as }}) with problems: {{ problems | join('; ') }}"
          - action: persistent_notification.create
            data:
              notification_id: "{{ 'arm_check_' ~ this.entity_id }}"
              title: "Alarm armed ({{ armed_as }}) with problems"
              message: >-
                {{ problems | join('; ') }}. These cannot trip the alarm until they
                report closed. Close / fix them, or disarm and re-arm.
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "Alarm armed ({{ armed_as }}) with problems"
                    message: >-
                      {{ problems | join('; ') }}. Can't trip the alarm until it reports
                      closed.
                    data:
                      tag: "{{ 'arm_check_' ~ this.entity_id }}"
                      push:
                        interruption-level: time-sensitive
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ 'arm_check_' ~ this.entity_id }}"
      - stop: Arming check only

  - if: "{{ last_trigger_helper is string and last_trigger_helper != '' }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ last_trigger_helper }}"
        data:
          value: "{{ what_happened }}"
  - action: logbook.log
    data:
      name: Alarm
      message: "{{ what_happened }} - tripping panel"
  - action: alarm_control_panel.alarm_trigger
    target:
      entity_id: !input alarm_panel

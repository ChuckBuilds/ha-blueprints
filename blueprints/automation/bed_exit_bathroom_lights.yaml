blueprint:
  name: Bed-exit predictive bathroom lights
  description: >-
    Motion-activated bathroom lighting that starts before the motion sensor
    can possibly see you.

    A PIR cannot report you until you are already in the room and standing in
    its field of view, and most battery PIRs then go blind for a cooldown
    period. On a night-time bathroom trip that is the whole problem: the light
    arrives after you do, so you reach for the switch anyway. No amount of
    automation tuning fixes it, because the automation was never the slow part
    - the sensor was.

    So this does not wait for the PIR. A bed occupancy sensor releases within a
    second or two of you sitting up, which is several seconds before you reach
    the door. That is the head start. When a bed empties during night mode the
    bathroom light comes up very dim immediately, and then waits for the motion
    sensor to confirm. If motion never arrives - you rolled over, or you went
    to the kitchen instead - the light backs itself out and nothing else
    happens.

    Once you are actually in the bathroom it behaves like a normal motion
    light, with one difference: it stays dim while night mode is on OR while
    anyone is still in bed, so a partner does not get a face full of vanity
    lights at 3am. Any other time you get the full brightness group.
  domain: automation
  input:
    motion_sensor:
      name: Bathroom motion sensor
      description: The occupancy or motion sensor in the bathroom.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: motion

    bed_sensors:
      name: Bed occupancy sensors
      description: >-
        One entry per side of the bed. Any of them going from on to off starts
        a pre-light; any of them still on keeps the bathroom dim.

        These need to release quickly to be worth anything. If yours has a
        delayed_off filter or a long debounce, shorten it - every second of
        filtering is a second of head start you are giving away.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor

    night_mode:
      name: Night mode toggle
      description: >-
        While this is on, bed exits trigger a pre-light and the bathroom stays
        dim. A sleep-mode input_boolean you already flip at bedtime is ideal.
      selector:
        entity:
          filter:
            - domain: input_boolean

    dim_light:
      name: Dim light
      description: >-
        The single light used for night trips - usually an overhead or ceiling
        fixture rather than vanity lights. This is what gets pre-lit.
      selector:
        entity:
          filter:
            - domain: light

    full_lights:
      name: Full brightness lights
      description: >-
        Everything to switch on for a normal daytime visit. A light group is
        fine. These are also switched off at the end of every visit, along with
        the dim light, so it does not matter whether the dim light is a member
        of this group.
      selector:
        entity:
          multiple: true
          filter:
            - domain: light

    prelight_pct:
      name: Pre-light brightness
      description: >-
        Brightness for the speculative pre-light, before motion has confirmed
        anything. Keep this low - it is the brightness a false positive costs
        you, and it should be barely visible from the bed.
      default: 8
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    dim_pct:
      name: Confirmed night brightness
      description: >-
        Brightness once motion confirms you are really in the bathroom, while
        night mode is on or someone is still in bed.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    confirm_window:
      name: Confirmation window
      description: >-
        How long a pre-light waits for motion before deciding it guessed wrong
        and switching itself back off.
      default: 90
      selector:
        number:
          min: 10
          max: 600
          step: 5
          unit_of_measurement: seconds
          mode: box

    night_off_delay:
      name: Night off delay
      description: >-
        Minutes of no motion before the lights go out while night mode is on.
        Short is good here - night trips are short.
      default: 3
      selector:
        number:
          min: 0.5
          max: 60
          step: 0.5
          unit_of_measurement: minutes
          mode: box

    day_grace:
      name: Extra daytime delay
      description: >-
        Added on top of the night off delay when night mode is off. Showers are
        the reason this exists: a PIR cannot see through a curtain, and its own
        occupancy timeout has usually already burned most of the off delay
        before Home Assistant even hears about it. If your lights die on you
        mid-shower, raise this.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          unit_of_measurement: minutes
          mode: box

# Every trigger cancels the run in flight. That is load-bearing in three
# places: returning motion cancels a pending off-delay, confirming motion
# cancels the pre-light's back-out timer, and the second person getting up
# does not queue a duplicate pre-light. Do not change this to single or queued.
mode: restart
max_exceeded: silent

variables:
  bed_sensors: !input bed_sensors

triggers:
  # The head start. Fires the moment a side of the bed is released.
  - trigger: state
    entity_id: !input bed_sensors
    from: "on"
    to: "off"
    id: bed_exit

  # The PIR finally catching up - or a normal daytime visit.
  - trigger: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"
    id: motion_on

  # Visit over.
  - trigger: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      minutes: !input night_off_delay
    id: motion_off

conditions: []

actions:
  - choose:

      # ---- Speculative: someone got out of bed at night --------------------
      - conditions:
          - condition: trigger
            id: bed_exit
          - condition: state
            entity_id: !input night_mode
            state: "on"
          # Never hijack a light that is already on. If it is lit, someone is
          # already using the room and owns it.
          - condition: state
            entity_id: !input dim_light
            state: "off"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input dim_light
            data:
              brightness_pct: !input prelight_pct
              transition: 2

          # Wait for the PIR to back up the guess. If motion does arrive, the
          # motion_on trigger restarts this automation and cancels this run
          # outright - the branch below takes over the light. So in practice
          # the only way past this wait is a timeout.
          - wait_for_trigger:
              - trigger: state
                entity_id: !input motion_sensor
                to: "on"
            timeout:
              seconds: !input confirm_window
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then:
              # Wrong guess. Undo it quietly and leave no state behind.
              - action: light.turn_off
                target:
                  entity_id: !input dim_light
                data:
                  transition: 2

      # ---- Confirmed: someone is in the bathroom ---------------------------
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          - if:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: !input night_mode
                    state: "on"
                  # Any bed still occupied means someone is asleep next door.
                  - condition: template
                    value_template: >-
                      {{ expand(bed_sensors)
                         | selectattr('state', 'eq', 'on')
                         | list | count > 0 }}
            then:
              # Same fixture and brightness the pre-light was heading for, so
              # confirming a pre-lit trip reads as a gentle step up rather than
              # a flash.
              - action: light.turn_on
                target:
                  entity_id: !input dim_light
                data:
                  brightness_pct: !input dim_pct
                  transition: 1
            else:
              - action: light.turn_on
                target:
                  entity_id: !input full_lights

      # ---- Quiet long enough: clear up -------------------------------------
      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - if:
              - condition: state
                entity_id: !input night_mode
                state: "off"
            then:
              # Cancelled outright if motion returns, because mode is restart.
              - delay:
                  minutes: !input day_grace
          # Both, unconditionally. The dim light may or may not be a member of
          # the full group, and turning off an already-off light costs nothing.
          - action: light.turn_off
            target:
              entity_id: !input full_lights
          - action: light.turn_off
            target:
              entity_id: !input dim_light

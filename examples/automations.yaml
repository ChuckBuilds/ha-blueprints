# Example wiring for two August locks with DoorSense.
# Append to automations.yaml (or drop into a package) and adjust the entity IDs.
# The blueprint path is case-sensitive and is created by the import
# (Settings > Automations > Blueprints shows the exact path).

- id: auto_lock_front_door
  alias: Auto-lock - Front Door
  description: Door-aware auto-lock, resets whenever the front door is opened.
  use_blueprint:
    path: ChuckBuilds/smart_auto_lock.yaml
    input:
      lock_entity: lock.front_door
      door_sensor: binary_sensor.front_door_door
      normal_delay: 20
      guest_delay: 35
      guest_mode: input_boolean.door_guest_mode
      party_mode: input_boolean.door_party_mode
      lock_attempts: 3

- id: auto_lock_back_door
  alias: Auto-lock - Back Door
  description: Door-aware auto-lock, resets whenever the back door is opened.
  use_blueprint:
    path: ChuckBuilds/smart_auto_lock.yaml
    input:
      lock_entity: lock.back_door
      # Doubled "back" is not a typo - check your own entity ID before copying.
      door_sensor: binary_sensor.back_back_door_door
      normal_delay: 20
      guest_delay: 35
      guest_mode: input_boolean.door_guest_mode
      party_mode: input_boolean.door_party_mode
      lock_attempts: 3

# Optional safety net: nobody ever remembers to turn party mode back off.
- id: door_party_mode_auto_expire
  alias: Door Party Mode - auto expire
  description: Turns party mode off after 6 hours so the doors do not stay unlocked overnight.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.door_party_mode
      to: "on"
      for: "06:00:00"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.door_party_mode

# ---------------------------------------------------------------------------
# Bed-exit predictive bathroom lights
# ---------------------------------------------------------------------------
# One automation per bathroom. The bed sensors can be shared between several
# bathrooms - an ensuite and a hall bathroom can both watch the same bed.

- id: master_bath_bed_exit_lights
  alias: Master Bath - bed-exit predictive lights
  description: Pre-lights the master bath on bed exit, then behaves as a motion light.
  use_blueprint:
    path: ChuckBuilds/bed_exit_bathroom_lights.yaml
    input:
      motion_sensor: binary_sensor.masterbathmotion_occupancy
      bed_sensors:
        - binary_sensor.bed_sensor_left_bed_occupancy
        - binary_sensor.bed_sensor_right_bed_occupancy
      night_mode: input_boolean.sleepmode
      dim_light: light.masterbathceiling
      full_lights:
        - light.bathroom_lights
      prelight_pct: 8
      dim_pct: 20
      confirm_window: 90
      night_off_delay: 3
      day_grace: 5
